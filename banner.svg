    <circle cx="420" cy="60" r="3"/><circle cx="540" cy="60" r="3"/><circle cx="660" cy="60" r="3"/>
    <circle cx="780" cy="60" r="3"/><circle cx="900" cy="60" r="3"/><circle cx="1020" cy="60" r="3"/>
    <circle cx="1140" cy="60" r="3"/><circle cx="1220" cy="60" r="3"/>
    <circle cx="60" cy="180" r="3"/><circle cx="180" cy="180" r="3"/><circle cx="300" cy="180" r="3"/>
    <circle cx="1020" cy="180" r="3"/><circle cx="1140" cy="180" r="3"/><circle cx="1220" cy="180" r="3"/>
    <circle cx="60" cy="300" r="3"/><circle cx="180" cy="300" r="3"/><circle cx="300" cy="300" r="3"/>
    <circle cx="1020" cy="300" r="3"/><circle cx="1140" cy="300" r="3"/><circle cx="1220" cy="300" r="3"/>
    <circle cx="60" cy="420" r="3"/><circle cx="180" cy="420" r="3"/><circle cx="300" cy="420" r="3"/>
    <circle cx="1020" cy="420" r="3"/><circle cx="1140" cy="420" r="3"/><circle cx="1220" cy="420" r="3"/>
    <circle cx="60" cy="540" r="3"/><circle cx="180" cy="540" r="3"/><circle cx="300" cy="540" r="3"/>
    <circle cx="420" cy="540" r="3"/><circle cx="1140" cy="540" r="3"/><circle cx="1220" cy="540" r="3"/>
  </g>

  <!-- 右上网络节点图 -->
  <g stroke="#22d3ee" stroke-opacity="0.45" stroke-width="2">
    <line x1="880" y1="130" x2="1000" y2="90"/>
    <line x1="1000" y1="90" x2="1120" y2="150"/>
    <line x1="1120" y1="150" x2="1000" y2="230"/>
    <line x1="1000" y1="230" x2="880" y2="130"/>
    <line x1="880" y1="130" x2="1120" y2="150"/>
    <line x1="1000" y1="90" x2="1000" y2="230"/>
  </g>
  <g fill="#22d3ee">
    <circle cx="880" cy="130" r="8" fill-opacity="0.9"/>
    <circle cx="1000" cy="90" r="8" fill-opacity="0.6"/>
    <circle cx="1120" cy="150" r="8" fill-opacity="0.4"/>
    <circle cx="1000" cy="230" r="8" fill-opacity="0.75"/>
  </g>
  <circle cx="1000" cy="90" r="18" fill="none" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="1.5"/>
  <circle cx="880" cy="130" r="24" fill="none" stroke="#22d3ee" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- 左下信号波纹 -->
  <circle cx="110" cy="500" r="34" fill="none" stroke="#14b8a6" stroke-opacity="0.2" stroke-width="2"/>
  <circle cx="110" cy="500" r="56" fill="none" stroke="#14b8a6" stroke-opacity="0.12" stroke-width="1.5"/>
  <circle cx="110" cy="500" r="80" fill="none" stroke="#14b8a6" stroke-opacity="0.07" stroke-width="1"/>

  <!-- Logo：网络图标 -->
  <rect x="72" y="64" width="96" height="96" rx="24" fill="url(#brand)"/>
  <circle cx="104" cy="112" r="13" fill="#ffffff" opacity="0.95"/>
  <circle cx="142" cy="100" r="13" fill="#ffffff" opacity="0.75"/>
  <circle cx="142" cy="124" r="13" fill="#ffffff" opacity="0.85"/>
  <line x1="110" y1="105" x2="136" y2="103" stroke="#0b1220" stroke-width="3" stroke-linecap="round"/>
  <line x1="110" y1="119" x2="136" y2="121" stroke="#0b1220" stroke-width="3" stroke-linecap="round"/>

  <!-- 主标题 -->
  <text x="72" y="316" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="78" font-weight="800" fill="#f8fafc" letter-spacing="1">dsh-netassist</text>

  <!-- 副标题 -->
  <text x="72" y="374" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="500" fill="#94a3b8">Network &amp; proxy assistant for DeepSeek Harness</text>

  <!-- 工具 chips -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="600">
    <g>
      <rect x="72" y="508" width="208" height="52" rx="26" fill="url(#chip)" stroke="#155e75" stroke-width="1.5"/>
      <text x="176" y="541" text-anchor="middle" fill="#67e8f9">github-status</text>
    </g>
    <g>
      <rect x="296" y="508" width="192" height="52" rx="26" fill="url(#chip)" stroke="#155e75" stroke-width="1.5"/>
      <text x="392" y="541" text-anchor="middle" fill="#67e8f9">proxy-status</text>
    </g>
    <g>
      <rect x="504" y="508" width="186" height="52" rx="26" fill="url(#chip)" stroke="#155e75" stroke-width="1.5"/>
      <text x="597" y="541" text-anchor="middle" fill="#67e8f9">proxy-probe</text>
    </g>
    <g>
      <rect x="706" y="508" width="132" height="52" rx="26" fill="url(#chip)" stroke="#155e75" stroke-width="1.5"/>
      <text x="772" y="541" text-anchor="middle" fill="#67e8f9">net-diag</text>
    </g>
    <g>
      <rect x="854" y="508" width="186" height="52" rx="26" fill="url(#chip)" stroke="#155e75" stroke-width="1.5"/>
      <text x="947" y="541" text-anchor="middle" fill="#67e8f9">hosts-check</text>
    </g>
  </g>
</svg>
